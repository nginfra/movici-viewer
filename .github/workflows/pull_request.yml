name: Pull Requests

on:
  pull_request:

env:
  python-version: "3.13"

jobs:
  lint-client:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: actions/setup-node@v6
      with:
        node-version: 22

    # Use the client's pinned prettier (via the workspace install) instead of a
    # floating `npx prettier`, so formatting checks are reproducible.
    - name: Install Dependencies
      working-directory: ./client
      run: npm install

    - name: Check formatting
      working-directory: ./client
      run: npm run lint:format

  build-client:
    # Phase 3 gate: build flow-lib (via the client's `prebuild`) then type-check
    # and build the client against the package's dist — catches dev(src) vs
    # prod(dist) drift and broken declaration/CSS emission.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Install (npm workspace)
      working-directory: ./client
      run: npm install

    - name: Build client (prebuild builds flow-lib; type-check + build use dist)
      working-directory: ./client
      run: npm run build

  unit-tests:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ env.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      working-directory: ./server
      run: |
        poetry install --extras dev

    - name: Run tests
      working-directory: ./server
      run: |
        poetry run pytest tests/
